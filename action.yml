name: Official SonarQube Scan
description: >
  Scan your code with SonarQube to detect Bugs, Vulnerabilities and Code Smells in up to 27 programming languages!
branding:
  icon: check
  color: green
runs:
  using: composite
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: docker.nexus.maif.io
        username: ${{ inputs.docker-user-name }}
        password: ${{ inputs.docker-password }}
    - name: Build Docker Image
      run: docker build --build-arg SONAR_TOKEN=${{ inputs.sonar-token }} -t my-sonarqube-scan ${{ github.action_path }}/.
      shell: bash
    - name: Run SonarQube Scan
      run: docker run -e SONAR_TOKEN="${{ inputs.sonar-token }}" -e SONAR_HOST_URL="${{ inputs.sonar-host-url }}" -e SONAR_ROOT_CERT="${{ inputs.sonar-root-cert }}" -e INPUT_PROJECTBASEDIR="${{ inputs.projectBaseDir }}"  --rm -v ${{ github.workspace }}:/workspace -w /workspace my-sonarqube-scan ${{ inputs.args }} ${{ inputs.projectBaseDir }}
      shell: bash

    # - name: Cleanup
    #   run: docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace my-sonarqube-scan /cleanup.sh
    #   shell: bash

inputs:
  args:
    description: Additional arguments to the sonar-scanner
    required: false
  projectBaseDir:
    description: Set the sonar.projectBaseDir analysis property
    required: false
    default: .
  docker-user-name:
    description: Docker username
    required: true
  docker-password:
    description: Docker password
    required: true
  sonar-token:
    description: SonarQube token
    required: true
  sonar-host-url:
    description: SonarQube host URL
    required: true
  sonar-root-cert:
    description: SonarQube root certificate
    required: true